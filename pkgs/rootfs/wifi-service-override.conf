# open-nanokvm-pro: stop the vendor wifi.service crash-restart loop (issue #43).
# Installed as /etc/systemd/system/wifi.service.d/override.conf -- the vendor
# unit itself lives at /etc/systemd/system/wifi.service, so this drop-in dir is
# the highest-precedence one systemd looks at for it.
#
# The vendor unit is Type=simple, RemainAfterExit=yes, Restart=on-failure,
# RestartSec=3, ExecStart=/opt/scripts/wifi.sh start. wifi.sh's wifi_start()
# ends with:
#
#     if lsmod | grep -q aic8800_fdrv; then
#         echo "aic8800_fdrv already loaded"
#         exit 1          # <-- reports "nothing to do" as a FAILURE
#     else
#         insmod /soc/ko/aic8800_fdrv.ko
#     fi
#
# so once the driver is up, every further run exits 1. Restart=on-failure re-runs
# it, and RestartSec=3 spaces the attempts wider than systemd's default start-rate
# limit window (StartLimitBurst=5 within StartLimitIntervalSec=10s -- 5 attempts
# take ~12s), so the limiter never trips and the unit restarts forever. Measured
# on the device: 2184 restarts, ~36k "Main process exited" lines in one syslog,
# ~100 MB/week of journal+syslog churn onto eMMC.
#
# Restart=no is the actual fix: loading the WiFi modules is a one-shot boot
# action, and retrying it cannot make an already-loaded module load again.
# RemainAfterExit=yes is already the vendor setting; it is restated here so the
# unit stays "active (exited)" rather than "dead" after a successful load even if
# the vendor unit changes underneath us, and so this file reads as a complete
# statement of the intended lifecycle.
#
# Deliberately NOT done (see issue #43 / #28): we do not mask or disable
# wifi.service. The one-shot boot-time module load still happens, so if the
# aic8800 blob decision goes the other way WiFi can be brought up with no change
# here. wifi.sh itself IS patched since #54 -- but only its four insmod/rmmod-by-
# path lines become modprobe, because the /soc/ko module copies it named are
# purged and the same modules are built from source into /usr/lib/modules
# (pkgs/rootfs/wifi.sh, vendor original pinned as wifi.sh.vendor).
[Service]
Restart=no
RemainAfterExit=yes
