# open-nanokvm-pro: rotate the NanoKVM app logs (issue #41).
#
# /var/log/nanokvm/NanoKVM-Server.log is the server's stdout+stderr, redirected
# by /kvmapp/scripts/nanokvm.sh (`$target >>"$LOG_DIR/$exe_name.log" 2>&1`) --
# server.yaml sets `logger.file: stdout`, so logrus never opens a file itself.
# The process holds that fd for its whole lifetime, so the log MUST be rotated
# with copytruncate: a rename+create would leave the server writing to an
# unlinked inode forever. The fd is O_APPEND (verified via /proc/<pid>/fdinfo),
# so truncating in place cannot leave a sparse hole. This also covers the
# C-side printf/stderr output of libkvm.so on the same fd, which a Go-side
# (lumberjack) fix could not reach.
#
# nanokvmd.log is the supervisor script's own log; nanokvm.sh already rm -f's
# it at 10 MB (check_log_size), so that stanza member is mostly a backstop.
#
# compress: rotation fires ~weekly at the normal ~1.6 MB/day write rate; the
# extra ~10 MB read + ~0.5 MB write per rotation caps the directory at ~11 MB
# instead of ~40 MB. Cheap insurance against eMMC churn.
/var/log/nanokvm/*.log {
    size 10M
    rotate 3
    copytruncate
    compress
    missingok
    notifempty
}
