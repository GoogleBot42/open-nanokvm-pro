# NanoKVM-Pro -- rung 2o (#89): the NixOS appliance under mainline U-Boot,
# on the #91 single-block stopgap. APPEND is the flashed board's own
# /proc/cmdline verbatim, plus the stage-1 panic contract.
#
# FDT is the mainline dtb with /soc/watchdog@4840000 status = "disabled":
# our ax630c_wdt stops WDT0 at probe, so a kernel that probes it and then
# fails takes the only channel that survives a hang down with it. With the
# node disabled, U-Boot's 300 s dog stays armed all the way into userspace
# and a failed boot resets instead of stranding the board -- and the next
# boot can read the console out of ramoops.
DEFAULT nixos
TIMEOUT 10
MENU TITLE NanoKVM-Pro (mainline chain, appliance)

LABEL nixos
	MENU LABEL NixOS appliance, mainline 7.1.3
	LINUX /Image
	FDT /ax630c-nowdt.dtb
	APPEND mem=512M console=ttyS0,115200n8 earlycon=uart8250,mmio32,0x4880000 board_id=0x5,boot_reason=0x00,initcall_debug=0 loglevel=8 usbcore.autosuspend=-1 root=/dev/mmcblk0p17 rootfstype=ext4 rw rootwait blkdevparts=mmcblk0:768K(spl),512K(ddrinit),256K(atf),256K(atf_b),1536K(uboot),1536K(uboot_b),1M(env),6M(logo),6M(logo_b),1M(optee),1M(optee_b),1M(dtb),1M(dtb_b),64M(kernel),64M(kernel_b),128M(boot),-(rootfs) logomode=vo0@dsi_dpi_video boot.panic_on_fail=1 panic=10
