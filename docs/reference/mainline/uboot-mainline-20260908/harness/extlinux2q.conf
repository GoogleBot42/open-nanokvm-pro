# NanoKVM-Pro -- rung 2q round 6 (#89): confirmation on the SHIPPING kernel (no diagnostic).
#
# Round 2 read the whole slot-B boot log and it says one thing:
#   axera-dwmac 104c0000.ethernet: Active PHY interface: RMII (4)
#   mdio_bus stmmac-0: MDIO device at address 1 is missing.
# against RGMII (1) on slot A. The MAC samples the flash-syscon PHY interface
# select at the release of its block reset, and dwmac-axera pulsed the reset
# BEFORE writing the select -- harmless under the vendor loader, which leaves
# the select at RGMII already, fatal under mainline U-Boot, which has no
# ethernet driver and leaves it at 0.
#
# This kernel writes the select first. systemd.mask and open_timeout stay on
# for one more round so a failure is still readable.
DEFAULT nixos
TIMEOUT 10
MENU TITLE NanoKVM-Pro (mainline chain, appliance)

LABEL nixos
	MENU LABEL NixOS appliance, mainline 7.1.3
	LINUX /Image
	FDT /ax630c-2q5.dtb
	APPEND mem=512M console=ttyS0,115200n8 earlycon=uart8250,mmio32,0x4880000 board_id=0x5,boot_reason=0x00,initcall_debug=0 loglevel=8 usbcore.autosuspend=-1 root=/dev/mmcblk0p17 rootfstype=ext4 rw rootwait blkdevparts=mmcblk0:768K(spl),512K(ddrinit),256K(atf),256K(atf_b),1536K(uboot),1536K(uboot_b),1M(env),6M(logo),6M(logo_b),1M(optee),1M(optee_b),1M(dtb),1M(dtb_b),64M(kernel),64M(kernel_b),128M(boot),-(rootfs) logomode=vo0@dsi_dpi_video systemd.mask=systemd-pstore.service watchdog.open_timeout=180 boot.panic_on_fail=1 panic=10
