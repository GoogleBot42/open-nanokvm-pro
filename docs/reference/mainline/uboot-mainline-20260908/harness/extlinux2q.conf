# NanoKVM-Pro -- rung 2q round 2 (#89).
#
# Round 1 settled what the kernel does under mainline U-Boot: it BOOTS, all the
# way to systemd, and the only thing that fails is
#
#   axera-dwmac 104c0000.ethernet end0: cannot attach to PHY (error: -ENODEV)
#
# which is why a working board looked like a dead one -- SSH is the only channel.
# The MDIO bus scan that lost the PHY happens at t=1 s and the 16 KiB console
# ring no longer held it, so this round pairs a 64 KiB ring (new dtb) with
# systemd.mask: unlinking a pstore record ZAPS THE LIVE CONSOLE ZONE, so
# systemd-pstore has to stay out of the way for a boot we want to read whole.
DEFAULT nixos
TIMEOUT 10
MENU TITLE NanoKVM-Pro (mainline chain, appliance)

LABEL nixos
	MENU LABEL NixOS appliance, mainline 7.1.3
	LINUX /Image
	FDT /ax630c-2q2.dtb
	APPEND mem=512M console=ttyS0,115200n8 earlycon=uart8250,mmio32,0x4880000 board_id=0x5,boot_reason=0x00,initcall_debug=0 loglevel=8 usbcore.autosuspend=-1 root=/dev/mmcblk0p17 rootfstype=ext4 rw rootwait blkdevparts=mmcblk0:768K(spl),512K(ddrinit),256K(atf),256K(atf_b),1536K(uboot),1536K(uboot_b),1M(env),6M(logo),6M(logo_b),1M(optee),1M(optee_b),1M(dtb),1M(dtb_b),64M(kernel),64M(kernel_b),128M(boot),-(rootfs) logomode=vo0@dsi_dpi_video systemd.mask=systemd-pstore.service watchdog.open_timeout=180 boot.panic_on_fail=1 panic=10
