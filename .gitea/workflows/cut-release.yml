name: cut-release

# Cut a release from the Gitea web UI: Actions → cut-release → Run workflow,
# enter the version (e.g. 2.0.1, or 2.1.0-alpha.1 for an ALPHA — any semver
# prerelease suffix makes it one). This job runs ON GITEA (the source of
# truth, where commits are legitimate) and only does git work — no nix:
#
#   write VERSION → commit "release: X.Y.Z" → tag vX.Y.Z → push main + tag
#   → force-move the rolling `preview` tag to the same commit
#
# From there the existing machinery takes over: the push mirror replicates
# the commits + tags to GitHub, and .github/workflows/release.yml (which runs
# only on GitHub — see its server_url guard) builds and publishes the
# release assets that devices poll. An alpha version publishes as a GitHub
# *prerelease*, which `releases/latest/download` (the stable channel) never
# serves; every cut also refreshes the rolling `preview` release the
# preview/alpha channel polls. docs/updates.md, "Cutting a release".
#
# tools/release remains the local fallback for the same tag-cutting step.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without leading v (e.g. 2.0.1)'
        required: true
      dry_run:
        description: 'Validate and show what would happen, but push nothing'
        type: boolean
        default: false

jobs:
  cut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0   # need existing tags for the duplicate check

      - name: Validate
        run: |
          V="${{ inputs.version }}"
          V="${V#v}"
          echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$' \
            || { echo "invalid version '$V' (expected X.Y.Z)"; exit 1; }
          git rev-parse -q --verify "refs/tags/v$V" >/dev/null \
            && { echo "tag v$V already exists"; exit 1; }
          [ "$(tr -d '[:space:]' < VERSION)" = "$V" ] \
            && { echo "VERSION is already $V but no tag exists — finish by pushing the tag manually (tools/release)"; exit 1; }
          # Release notes are mandatory: CHANGELOG.md must carry a "## v$V"
          # section (the GitHub release workflow lifts it into the release body).
          grep -qxF "## v$V" CHANGELOG.md \
            || { echo "CHANGELOG.md has no '## v$V' section — write the release notes first"; exit 1; }
          echo "--- release notes for v$V ---"
          awk -v h="## v$V" '$0==h{p=1;next} /^## /{p=0} p' CHANGELOG.md
          echo "V=$V" >> "$GITHUB_ENV"

      - name: Bump VERSION, commit, tag
        run: |
          git config user.name  "gitea-actions"
          git config user.email "actions@git.neet.dev"
          printf '%s\n' "$V" > VERSION
          git add VERSION
          git commit -m "release: $V"
          git tag "v$V"
          git show --stat --oneline HEAD

      - name: Push (skipped on dry run)
        if: ${{ !inputs.dry_run }}
        run: |
          git push origin main "refs/tags/v$V"
          # The rolling `preview` tag marks the newest cut of ANY kind; the
          # GitHub release workflow re-points the preview-channel release at
          # it. Created here (the source of truth) so the mirror owns it —
          # GitHub-side ref creation would diverge from the mirror.
          git tag -f preview "v$V"
          git push -f origin refs/tags/preview
          echo "Pushed release commit + tag v$V (+ rolling preview tag). The"
          echo "mirror will carry them to GitHub, whose release workflow"
          echo "builds and publishes the assets:"
          echo "  https://github.com/GoogleBot42/open-nanokvm-pro/actions"

      - name: Dry run summary
        if: ${{ inputs.dry_run }}
        run: echo "DRY RUN — nothing pushed. Would have pushed the commit above and tag v$V."
