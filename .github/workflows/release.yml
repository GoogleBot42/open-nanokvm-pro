name: release

# Publishes a release when a `vX.Y.Z` tag arrives.
#
# This GitHub repo is a READ-ONLY DOWNSTREAM MIRROR of the Gitea source of
# truth (git.neet.dev/zuckerberg/open-nanokvm-pro). Tags are cut on Gitea
# (`tools/release`) and reach here via the push mirror; this workflow's only
# job is to build and attach release assets to the mirrored tag. It must
# NEVER create commits or tags — that would diverge from the mirror. Hence:
# no workflow_dispatch, no VERSION writing; the committed VERSION file is the
# source of truth and must already equal the tag (tools/release guarantees
# this before the tag ever leaves Gitea).
#
# Publishing a release IS the update push, and it is TWO halves (#100):
#
#   1. `attic push` puts the appliance's toplevel CLOSURE in the binary cache,
#      signed. This is the payload, and it must land BEFORE the manifest --
#      a manifest naming a path no cache has is an update every device on the
#      channel fails.
#   2. `nanokvm_pro_sys_latest.json` -- a few hundred bytes naming that store
#      path -- is attached to the release, where `nanokvm-update` polls it
#      (`nanokvm.update.stableUrl`, docs/updates.md).
#
# The 460 MB tarball of #86 is gone: the device substitutes what it does not
# already have, which for a typical update is a few percent of the closure.
#
# The job is idempotent: re-running upserts the release and re-uploads any
# missing asset, so a transient failure is recovered by re-running the run.
#
# Why the .axp upload is split out: GitHub's large release-asset path
# intermittently 500s with "Error creating policy". action-gh-release surfaces
# that as a fatal error that aborts the whole release (it took down the first
# real run *after* the update assets had uploaded). So the update assets — the
# only thing a device needs — publish first via action-gh-release, and the
# 1.4 GB .axp uploads afterward with the `gh` CLI (proper chunked upload +
# backoff) and retries. If it still fails, the job fails loudly; the update is
# already live and a re-run finishes the .axp.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write        # create releases + upload assets (never commits)

jobs:
  release:
    # Gitea Actions also picks up .github/workflows/ — this guard makes sure
    # the heavy build only ever runs on GitHub's runners, never on the Gitea
    # runner (which has no binary cache and no nix sandbox).
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 150   # the cross kernel + boot chain + multi-GB rootfs are slow
    steps:
      - name: Free up runner disk space
        # The NixOS closure is ~1.3 GB and it is staged again inside the .axp;
        # the stock runner image leaves too little headroom. (It used to be
        # staged a third time, inside the #86 tar bundle -- that one is gone.)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune -a -f || true
          df -h /

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0   # full history for release notes

      # aarch64 EMULATION, and it is not optional since #86. The appliance is a
      # NixOS system evaluated as native aarch64-linux: nearly all of it
      # substitutes prebuilt from cache.nixos.org, but the handful of
      # configuration derivations (etc, system-path, the units, the system
      # closure itself) are built here, and without binfmt they simply cannot
      # be. The dev box gets this from its own `extra-platforms`; a runner needs
      # the qemu handlers installed first.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            system-features = big-parallel kvm
            extra-platforms = aarch64-linux

      - name: Resolve and verify version
        id: ver
        run: |
          # NOTHING PUBLISHES FROM A BRANCH. The `on:` trigger is already tags
          # only, but this job is what writes the two things a device polls --
          # `releases/latest/download` and the rolling `preview` release -- so
          # the rule is asserted here as well rather than left to a trigger a
          # future edit could widen. A device must never be offered the tip of
          # main: the alpha channel is prerelease TAGS. docs/updates.md.
          [ "${GITHUB_REF_TYPE}" = "tag" ] \
            || { echo "::error::this workflow publishes update channels and may only run on a tag (ref_type='${GITHUB_REF_TYPE}', ref='${GITHUB_REF}')"; exit 1; }
          V="${GITHUB_REF_NAME#v}"
          echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$' \
            || { echo "::error::invalid tag '$GITHUB_REF_NAME' (expected vX.Y.Z)"; exit 1; }
          FILE="$(tr -d '[:space:]' < VERSION)"
          [ "$FILE" = "$V" ] || { echo "::error::VERSION file ('$FILE') != tag version ('$V'). Tags are cut from Gitea with tools/release, which keeps them in lockstep — do not hand-create tags."; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V"    >> "$GITHUB_OUTPUT"
          # Any semver prerelease suffix (e.g. 2.1.0-alpha.1) = alpha cut:
          # published as a GitHub prerelease, which the stable channel's
          # `releases/latest/download` alias never serves.
          case "$V" in
            *-*) echo "prerelease=true"  >> "$GITHUB_OUTPUT"; echo "Release v$V (ALPHA/prerelease)";;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT"; echo "Release v$V";;
          esac

      - name: Build the appliance closure and its manifest (the update payload)
        id: closure
        run: |
          nix build .#appliance-toplevel --print-build-logs --out-link result-system
          nix build .#system-manifest   --print-build-logs --out-link result-update
          TOP="$(readlink -f result-system)"
          echo "toplevel=$TOP" >> "$GITHUB_OUTPUT"
          echo "the update payload is $TOP"
          # The manifest must name what we just built, or every device on the
          # channel substitutes a path nothing pushed. `nix flake check` asserts
          # this too (nanokvm-system-manifest); asserting it again here costs
          # nothing and catches a workflow edit that builds the wrong output.
          MF_TOP="$(jq -r .toplevel result-update/nanokvm_pro_sys_latest.json)"
          [ "$MF_TOP" = "$TOP" ] \
            || { echo "::error::the manifest names $MF_TOP but the release built $TOP"; exit 1; }

      - name: Push the closure to the binary cache
        # NEEDS-HUMAN UNTIL THE SECRETS EXIST (#96). Three repository secrets,
        # all Jeremy's to create:
        #
        #   ATTIC_ENDPOINT   https://attic.example.org       (the server)
        #   ATTIC_CACHE      nanokvm-pro                     (the cache name)
        #   ATTIC_TOKEN      a push token for that cache
        #
        # ...and the cache's PUBLIC key has to match `nixConfig.
        # extra-trusted-public-keys` in flake.nix and
        # `nanokvm.update.trustedPublicKeys` in nixos/appliance.nix, because
        # that is what the device checks every NAR against. attic signs with
        # the cache's own key on the server side; nothing here holds it.
        #
        # THIS STEP RUNS BEFORE ANYTHING IS PUBLISHED. A release whose manifest
        # is live and whose closure is not is an update every device fails, so
        # the push is the gate: if the secrets are missing the job stops here
        # with a loud error rather than publishing a manifest nobody can
        # install. (The .axp is a complete image and needs no cache, which is
        # why a cacheless release is still recoverable -- by reflashing.)
        env:
          ATTIC_ENDPOINT: ${{ secrets.ATTIC_ENDPOINT }}
          ATTIC_CACHE: ${{ secrets.ATTIC_CACHE }}
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
          TOPLEVEL: ${{ steps.closure.outputs.toplevel }}
        run: |
          if [ -z "$ATTIC_ENDPOINT" ] || [ -z "$ATTIC_TOKEN" ] || [ -z "$ATTIC_CACHE" ]; then
            echo "::error::ATTIC_ENDPOINT / ATTIC_CACHE / ATTIC_TOKEN are not set."
            echo "::error::Without them this release would publish a manifest naming a closure no cache serves, and every device on the channel would fail to update. See docs/updates.md (#96)."
            exit 1
          fi
          nix profile install nixpkgs#attic-client
          attic login nanokvm "$ATTIC_ENDPOINT" "$ATTIC_TOKEN"
          # The whole closure, not just the toplevel: a device fetches every
          # path it is missing, and a partially pushed closure is an update
          # that dies halfway through `nix copy`.
          attic push "nanokvm:$ATTIC_CACHE" "$TOPLEVEL"
          echo "pushed $(nix path-info -r "$TOPLEVEL" | wc -l) store paths to $ATTIC_CACHE"

      - name: Build firmware image (.axp)
        # The MAINLINE appliance image (#86): the product, and the only way onto
        # a board that is not already running it -- there is no migration path,
        # a vendor-layout device is reflashed over AXDL. It also needs no
        # vendor bundle, so this no longer drags the 1.4 GB base .axp fetch.
        run: nix build .#nixos-firmware-image-mainline --print-build-logs --out-link result-image

      - name: Stage release assets
        run: |
          mkdir -p dist
          cp result-update/nanokvm_pro_sys_latest.json dist/
          cp result-image/*.axp                        dist/
          echo "--- release assets ---"; ls -l dist
          grep -q '"version": "${{ steps.ver.outputs.version }}"' dist/nanokvm_pro_sys_latest.json \
            || { echo "::error::manifest version != ${{ steps.ver.outputs.version }}"; exit 1; }
          # Release description = this version's CHANGELOG.md section (written
          # on Gitea before the cut; cut-release refuses to tag without it),
          # plus a compare link to the previous tag. Never fails the build: a
          # missing section degrades to a one-line body.
          TAG="${{ steps.ver.outputs.tag }}"
          {
            if grep -qxF "## $TAG" CHANGELOG.md 2>/dev/null; then
              awk -v h="## $TAG" '$0==h{p=1;next} /^## /{p=0} p' CHANGELOG.md
            else
              echo "No CHANGELOG.md section for $TAG."
            fi
            PREV="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$TAG^" 2>/dev/null || true)"
            if [ -n "$PREV" ]; then
              echo
              echo "**Full changelog:** https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${TAG}"
            fi
          } > dist/RELEASE_NOTES.md
          echo "--- release notes ---"; cat dist/RELEASE_NOTES.md

      - name: Publish release + update assets
        # Small next to the .axp, and all a device needs. Creates (or updates, on
        # re-run) the release on the already-mirrored tag.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          prerelease: ${{ steps.ver.outputs.prerelease == 'true' }}
          files: |
            dist/nanokvm_pro_sys_latest.json
          fail_on_unmatched_files: true
          body_path: dist/RELEASE_NOTES.md

      - name: Refresh the rolling preview-channel release
        # The preview/alpha channel polls the fixed URL
        # releases/download/preview/nanokvm_pro_sys_latest.json
        # (`nanokvm.update.previewUrl`): a rolling release on the mirrored `preview`
        # tag, refreshed on EVERY cut (stable or alpha) so preview devices
        # always see the newest version of either kind. Since #100 the only
        # asset is the manifest -- the payload lives in the binary cache, which
        # both channels share, so there is nothing here to prune.
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          if ! git ls-remote --exit-code origin refs/tags/preview >/dev/null; then
            echo "::warning::no 'preview' tag on this repo yet (older cut-release); skipping preview-channel refresh"
            exit 0
          fi
          if ! gh release view preview >/dev/null 2>&1; then
            gh release create preview --prerelease \
              --title "preview channel (rolling)" \
              --notes "Rolling release backing the web UI's *preview updates* channel. Assets always track the most recently cut release (stable or alpha) — see docs/updates.md."
          fi
          gh release upload preview "dist/nanokvm_pro_sys_latest.json" --clobber
          # Payload tarballs from the #86 era, if any are still attached.
          gh release view preview --json assets -q '.assets[].name' \
            | grep -x 'nanokvm_pro_sys_.*\.tar\.gz' \
            | while read -r stale; do
                echo "pruning retired bundle asset: $stale"
                gh release delete-asset preview "$stale" -y
              done

      - name: Upload firmware .axp
        # Separate from the update assets because GitHub's large-asset upload
        # intermittently 500s ("Error creating policy"). The `gh` CLI does the
        # correct chunked upload; we retry genuine transients and fail loudly if
        # the upload truly cannot complete (the update is already live — re-run to
        # finish the .axp).
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          axp=$(ls dist/*.axp)
          n=5
          for attempt in $(seq 1 "$n"); do
            if gh release upload "$TAG" "$axp" --clobber; then
              echo "uploaded $(basename "$axp") on attempt $attempt"
              exit 0
            fi
            if [ "$attempt" -lt "$n" ]; then
              echo "::warning::.axp upload attempt $attempt/$n failed; retrying in $((attempt*20))s..."
              sleep $((attempt*20))
            fi
          done
          echo "::error::.axp upload failed after $n attempts. The update (cache push + manifest) is published and live; re-run this workflow to finish uploading the .axp."
          exit 1
